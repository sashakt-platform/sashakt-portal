name: Deploy Sashakt portal to staging

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-staging-portal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          TEST_TAKER_URL: ${{ vars.TEST_TAKER_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_URL,TEST_TAKER_URL,SENTRY_AUTH_TOKEN
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR=/home/ubuntu/src/sashakt-portal
            PM2_CONFIG=/home/ubuntu/src/sashakt-pm2.config.cjs

            # --- guard rails -------------------------------------------------
            if [ -z "$BACKEND_URL" ]; then
              echo "::error::BACKEND_URL is not defined in the staging environment"
              exit 1
            fi
            if [ -z "$TEST_TAKER_URL" ]; then
              echo "::error::TEST_TAKER_URL is not defined in the staging environment"
              exit 1
            fi
            if [ ! -f "$PM2_CONFIG" ]; then
              echo "::error::$PM2_CONFIG not found — runtime config lives there"
              exit 1
            fi

            # --- sync source -------------------------------------------------
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/sashakt-platform/sashakt-portal.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fdx
            echo "Deploying $(git rev-parse --short HEAD)"

            # --- build-time env (Vite reads this at build only) --------------
            {
              echo "BACKEND_URL=$BACKEND_URL"
              echo "TEST_TAKER_URL=$TEST_TAKER_URL"
              echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
              echo "PUBLIC_APP_ENV=staging"
            } > .env

            # --- build -------------------------------------------------------
            pnpm install --frozen-lockfile
            pnpm run build

            if [ ! -f build/index.js ]; then
              echo "::error::Build output not found: build/index.js"
              exit 1
            fi

            # --- run ---------------------------------------------------------
            pm2 startOrReload "$PM2_CONFIG" --only sashakt-portal --update-env
            pm2 save

            sleep 3
            curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null -w 'health: %{http_code}\n' http://127.0.0.1:3000/
